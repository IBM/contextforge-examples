[project]
name = "qr-code-server"
version = "0.1.0"
description = "MCP server that provides QR code generation and decoding capabilities"
authors = [
  { name = "Matheus Cafalchio", email = "mcafalchio@gmail.com" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48.0.1", # Transitive pin
    "fastmcp>=3.2.4",
    "mcp>=1.28.1",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
]

[tool.uv]
exclude-newer-package = { "cryptography" = "2026-06-10T00:00:00Z" }
# Minimum versions for transitive dependencies.
constraint-dependencies = [
    "authlib>=1.6.12",
    "idna>=3.15",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_code_server"]

[project.scripts]
qr-code-server = "qr_code_server.server:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "B", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qr_code_server --cov-report=term-missing"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "ipython>=9.7.0",
    "pipdeptree>=2.31.0",
    "puremagic>=1.30",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]
