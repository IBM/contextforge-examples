description: "A plugin that does policy decision and enforcement using cedar"
author: "Shriti Priya"
version: "0.1.0"
available_hooks:
  - "prompt_pre_fetch"
  - "prompt_post_fetch"
  - "tool_pre_invoke"
  - "tool_post_invoke"
  - "resource_pre_fetch"
  - "resource_post_fetch"
default_configs:
  policy_lang: "cedar"
  policy_output_keywords:
    view_full: "view_full_output"
    view_redacted: "view_redacted_output"
